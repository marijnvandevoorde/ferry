name: FujiImport
options:
  bundleIdPrefix: io.github.fujiimport
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
packages:
  FujiKit:
    path: .
targets:
  FujiImport:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: FujiKit
        product: FujiKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ferry
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.photography
        NSLocalNetworkUsageDescription: Ferry connects to your camera over its Wi-Fi network to read and download photos.
        NSPhotoLibraryUsageDescription: Ferry adds the photos you import to an album in your library.
        NSPhotoLibraryAddUsageDescription: Ferry saves photos from your camera to your Photos library.
        NSBluetoothAlwaysUsageDescription: Ferry pairs with newer Fujifilm cameras over Bluetooth to start their Wi-Fi.
    entitlements:
      path: App/FujiImport.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Talking to the camera; PC AutoSave will also need to accept connections.
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.personal-information.photos-library: true
        # Pairing with newer cameras, which start their Wi-Fi over Bluetooth.
        com.apple.security.device.bluetooth: true
        # Folder destinations chosen by the user.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_NAME: Ferry
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fujiimport.FujiImport
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        MARKETING_VERSION: "0.2.0"
        # CI sets the build number from the run number.
        CURRENT_PROJECT_VERSION: "1"
