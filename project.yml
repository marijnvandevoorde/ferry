name: FujiImport
options:
  bundleIdPrefix: io.github.fujiimport
  deploymentTarget:
    macOS: "14.0"
packages:
  FujiKit:
    path: .
targets:
  FujiImport:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: FujiKit
        product: FujiKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fuji Import
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.photography
        NSLocalNetworkUsageDescription: Fuji Import connects to your camera over its Wi-Fi network to read and download photos.
        NSPhotoLibraryUsageDescription: Fuji Import adds the photos you import to an album in your library.
        NSPhotoLibraryAddUsageDescription: Fuji Import saves photos from your camera to your Photos library.
    entitlements:
      path: App/FujiImport.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Talking to the camera; PC AutoSave will also need to accept connections.
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.personal-information.photos-library: true
        # Folder destinations chosen by the user.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_NAME: Fuji Import
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fujiimport.FujiImport
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        # CI sets the build number from the run number.
        CURRENT_PROJECT_VERSION: "1"
