# Flathub manifest. It repackages the .deb from the GitHub release (built by .github/workflows/release.yml from
# this repository); building the Swift sidecar, Rust and npm dependencies offline from source is still to do.
# On a new release: update the URL, sha256 and the <releases> list in the metainfo.
id: io.github.marijnvandevoorde.Ferry
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: ferry
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Talking to the camera on its Wi-Fi network, and PC AutoSave on the home network.
  - --share=network
  # The default import folder; other folders come through the file chooser portal.
  - --filesystem=xdg-pictures
  # Pairing newer Fujifilm cameras over Bluetooth.
  - --system-talk-name=org.bluez
modules:
  - name: ferry
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/marijnvandevoorde/ferry/releases/download/v0.2.2/Ferry_0.2.2_amd64.deb
        sha256: 63402630d35f6269f0032fdeeeb85e06da8b4a29ecf329763583182a133ba43e
        dest-filename: ferry.deb
        only-arches: [x86_64]
      - type: file
        path: io.github.marijnvandevoorde.Ferry.desktop
      - type: file
        path: io.github.marijnvandevoorde.Ferry.metainfo.xml
    build-commands:
      - ar x ferry.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/ferry usr/bin/ferryctl -t /app/bin
      - install -Dm644 usr/lib/Ferry/THIRD-PARTY-NOTICES.txt -t /app/lib/Ferry
      - for size in 32 128 512; do install -Dm644 usr/share/icons/hicolor/${size}x${size}/apps/ferry.png /app/share/icons/hicolor/${size}x${size}/apps/io.github.marijnvandevoorde.Ferry.png; done
      - install -Dm644 io.github.marijnvandevoorde.Ferry.desktop -t /app/share/applications
      - install -Dm644 io.github.marijnvandevoorde.Ferry.metainfo.xml -t /app/share/metainfo
