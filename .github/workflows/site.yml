name: site

# Pull requests only build and check the site. Deploying is by hand: run it on main
# (scripts/release.py does: gh workflow run site.yml --ref main).
on:
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 site/tools/build.py
      - run: python3 site/tools/check.py
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy site/dist --project-name "$(python3 -c 'import json; print(json.load(open("site/site.json"))["cloudflare_project"])')" --branch main
