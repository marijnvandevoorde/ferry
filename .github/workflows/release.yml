name: Release

# Push a tag like v0.2.0. Needs the secrets and variables described in docs/releasing.md.
# Run it by hand for a dry run: everything is signed and notarized, but nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dryrun' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> $GITHUB_ENV
          echo "MARKETING_VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Archive
        run: |
          xcodebuild archive -project FujiImport.xcodeproj -scheme FujiImport -configuration Release \
            -archivePath build/FujiImport.xcarchive -destination 'generic/platform=macOS' \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Check App Store signing
        if: github.ref_type != 'tag'
        run: |
          cat > build/app-store-check.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/FujiImport.xcarchive -exportPath build/app-store-check \
            -exportOptionsPlist build/app-store-check.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # API keys can't use cloud-managed Developer ID certificates, so this one comes from secrets.
      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12" | base64 --decode > $RUNNER_TEMP/developer-id.p12
          security import $RUNNER_TEMP/developer-id.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

      - name: Export Developer ID build
        run: |
          cat > build/developer-id.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/FujiImport.xcarchive -exportPath build/developer-id \
            -exportOptionsPlist build/developer-id.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Notarize and package
        run: |
          APP="build/developer-id/Fuji Import.app"
          DMG="build/FujiImport-$MARKETING_VERSION.dmg"
          hdiutil create -volname "Fuji Import" -srcfolder "$APP" -ov -format UDZO "$DMG"
          xcrun notarytool submit "$DMG" --key "$KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          echo "DMG=$DMG" >> $GITHUB_ENV

      - name: Keep the DMG (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: ${{ env.DMG }}
          retention-days: 3

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" "$DMG" --title "Fuji Import $MARKETING_VERSION" --generate-notes

      - name: Upload to App Store Connect
        if: github.ref_type == 'tag' && vars.APP_STORE_UPLOAD == 'true'
        run: |
          cat > build/app-store.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/FujiImport.xcarchive -exportPath build/app-store \
            -exportOptionsPlist build/app-store.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libcurl4-openssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install
      - run: pnpm run sidecar
      - name: Build installers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then BUNDLES=appimage,deb; else BUNDLES=msi,nsis; fi
          pnpm tauri build --bundles "$BUNDLES"
      # Windows code signing (issue #42) and the Flathub submission (#43) are still to do.
      - name: Keep installers (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 3
      - name: Attach installers to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The mac job creates the release; wait for it.
          for i in $(seq 60); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/*/*.{AppImage,deb,msi,exe} --clobber 2>/dev/null || \
            gh release upload "$GITHUB_REF_NAME" $(ls src-tauri/target/release/bundle/*/* | grep -E '\.(AppImage|deb|msi|exe)$') --clobber
