name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app
        run: |
          xcodegen generate
          xcodebuild -project FujiImport.xcodeproj -scheme FujiImport -configuration Release \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test

  windows:
    runs-on: windows-2022
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test

  emulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build vcam
        run: docker build -q -t vcam-fuji scripts/vcam
      - name: Every emulated Fuji model
        run: scripts/test-vcam.sh
      - name: PC AutoSave
        run: scripts/test-vcam-autosave.sh

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install
        run: pnpm install
      - name: Build fujictl sidecar
        run: pnpm run sidecar
      - name: Build app
        run: pnpm tauri build --debug --no-bundle
