name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app
        run: |
          xcodegen generate
          xcodebuild -project FujiImport.xcodeproj -scheme FujiImport -configuration Release \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test

  windows:
    runs-on: windows-2022
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test

  emulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build vcam
        run: docker build -q -t vcam-fuji scripts/vcam
      - name: Every emulated Fuji model
        run: scripts/test-vcam.sh
      - name: PC AutoSave
        run: scripts/test-vcam-autosave.sh
