<!doctype html>
<!-- The social sharing card (1200×630): the scenic app icon (brand/icons/ferry-app-icon.png), the name and the tagline. -->
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: "Newsreader"; font-weight: 200 800; src: url(../../fonts/newsreader.woff2) format("woff2-variations"); }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url(../../fonts/inter.woff2) format("woff2-variations"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: flex; align-items: center; gap: 72px; padding: 0 96px; box-sizing: border-box; color: #fbfaf7;
         background: linear-gradient(180deg, #1b2440 0%, #3b3a6b 55%, #7a4766 88%, #c9775f 100%);
         font-family: "Inter", sans-serif; }
  .copy { flex: 1; }
  h1 { font-family: "Newsreader", Georgia, serif; font-weight: 600; font-size: 150px; line-height: 1; margin: 0 0 24px; letter-spacing: -4px; }
  p { font-size: 34px; margin: 0; color: rgb(251 250 247 / 88%); }
  img { width: 340px; height: 340px; filter: drop-shadow(0 24px 40px rgb(10 12 30 / 45%)); }
</style></head><body>
  <div class="copy">
    <h1>Ferry</h1>
    <p>Your photos, carried safely home.</p>
  </div>
  <img src="../../../brand/icons/ferry-app-icon.png" alt="">
</body></html>
