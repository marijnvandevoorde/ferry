<!doctype html>
<!-- The social sharing card (1200×630). No app name on it, so renaming the app doesn't mean redrawing it. -->

  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #fff;
         background: linear-gradient(180deg, #1b2440 0%, #3b3a6b 50%, #8a4f6e 80%, #f4a26b 100%); position: relative; }
  .copy { position: absolute; left: 72px; top: 150px; width: 470px; }
  img.icon { width: 96px; height: 96px; }
  h1 { font-size: 52px; line-height: 1.08; margin: 28px 0 18px; letter-spacing: -1px; }
  p { font-size: 24px; color: rgba(255,255,255,.82); margin: 0; }
  iframe { position: absolute; left: 590px; top: 110px; width: 800px; height: 550px; border: 0; transform: scale(.88); transform-origin: top left;
           border-radius: 16px; box-shadow: 0 30px 60px rgba(10,10,30,.45); }
</style></head><body>
  <div class="copy">
    <img class="icon" src="../../img/icon-192.png" alt="">
    <h1>Camera to computer over Wi&#8209;Fi</h1>
    <p>Fujifilm and more · Mac, Windows, Linux · Free</p>
  </div>
  <iframe src="mac.html"></iframe>
</body></html>
