<!doctype html>
<!-- A drawing of the Mac app's gallery, for the website until real screenshots replace it (see site/README.md). -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: transparent; }
  body { font: 13px/1.35 -apple-system, BlinkMacSystemFont, sans-serif; color: #1d1d1f; padding: 0; }
  .win { width: 800px; height: 550px; border-radius: 16px; overflow: hidden; background: #fff; display: flex; flex-direction: column;
         box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
  .bar { height: 52px; display: flex; align-items: center; padding: 0 14px; gap: 14px; background: #f6f6f6; border-bottom: .5px solid #d8d8d8; }
  .lights { display: flex; gap: 8px; } .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .t h1 { font-size: 14px; margin: 0; font-weight: 700; } .t p { margin: 0; font-size: 11px; color: #86868b; }
  .seg { margin: 0 auto; display: flex; background: #e4e4e6; border-radius: 8px; padding: 2px; font-size: 12px; }
  .seg span { padding: 3px 12px; border-radius: 6px; } .seg .on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 500; }
  .tools { display: flex; gap: 10px; align-items: center; color: #555; }
  .slider { width: 80px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #c9472b 35%, #d1d1d6 35%); position: relative; }
  .slider::after { content: ""; position: absolute; left: 22px; top: -7px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .ico { width: 30px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 14px; }
  .grid { flex: 1; overflow: hidden; padding: 0 16px; }
  .day { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 8px; }
  .day b { font-size: 13px; } .day a { color: #c9472b; font-size: 12px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cell { position: relative; aspect-ratio: 3/2; border-radius: 8px; overflow: hidden; background-size: cover; background-position: center; }
  .cell.done { opacity: .55; }
  .tag { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.45); color: #fff; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 9px; }
  .sel { position: absolute; right: 7px; top: 7px; width: 18px; height: 18px; border-radius: 50%; background: #c9472b; border: 2px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3);
         color: #fff; font-size: 11px; display: grid; place-items: center; font-weight: 800; }
  .foot { height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #f6f6f6; border-top: .5px solid #d8d8d8; }
  .foot .muted { color: #86868b; margin-right: auto; }
  .btn { padding: 6px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.2), 0 1px 1px rgba(0,0,0,.08); }
  .btn.primary { background: #c9472b; color: #fff; box-shadow: none; min-width: 120px; text-align: center; }
</style></head><body>
<div class="win">
  <div class="bar">
    <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="t"><h1>X-T20</h1><p>12 items · 9 not imported</p></div>
    <div class="seg"><span class="on">All</span><span>Not Imported</span></div>
    <div class="tools"><div class="slider"></div><span class="ico">⚲</span><span class="ico">◎</span><span class="ico">⏏</span></div>
  </div>
  <div class="grid">
    <div class="day"><b>Thursday, October 22, 2026</b><a>Select</a></div>
    <div class="row">
      <div class="cell" style="background-image:url(photos/scene12.jpg)"><span class="sel">✓</span></div>
      <div class="cell" style="background-image:url(photos/scene11.jpg)"><span class="sel">✓</span></div>
      <div class="cell" style="background-image:url(photos/scene10.jpg)"><span class="tag">🔒</span></div>
      <div class="cell" style="background-image:url(photos/scene09.jpg)"></div>
    </div>
    <div class="day"><b>Monday, October 19, 2026</b><a>Select</a></div>
    <div class="row">
      <div class="cell" style="background-image:url(photos/scene08.jpg)"></div>
      <div class="cell" style="background-image:url(photos/scene07.jpg)"></div>
      <div class="cell" style="background-image:url(photos/scene06.jpg)"><span class="tag">🔒</span></div>
      <div class="cell" style="background-image:url(photos/scene05.jpg)"></div>
    </div>
    <div class="day"><b>Sunday, October 18, 2026</b><a>Select</a></div>
    <div class="row">
      <div class="cell" style="background-image:url(photos/scene04.jpg)"></div>
      <div class="cell done" style="background-image:url(photos/scene03.jpg)"><span class="tag">✓ Imported</span></div>
      <div class="cell done" style="background-image:url(photos/scene02.jpg)"><span class="tag">✓ Imported</span></div>
      <div class="cell done" style="background-image:url(photos/scene01.jpg)"><span class="tag">✓ Imported</span></div>
    </div>
  </div>
  <div class="foot">
    <span class="muted">Imports into Photos, album “Fujifilm 2026-10”</span>
    <span class="btn">Import 2 Selected</span>
    <span class="btn primary">Import 9 New</span>
  </div>
</div>
</body></html>
